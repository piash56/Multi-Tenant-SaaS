name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: saas_test
          POSTGRES_USER: saas_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_test -d saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://saas_test:ci-only-password@localhost:5432/saas_test?schema=public
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      AUTH_JWT_SECRET: ci-only-auth-secret-at-least-32-characters-long
      AUTH_JWT_ISSUER: unified-inbox-api
      AUTH_JWT_AUDIENCE: unified-inbox-clients
      AUTH_COOKIE_SECURE: "false"
      SWAGGER_ENABLED: "false"
      NEXT_PUBLIC_API_URL: http://localhost:3001
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3001
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and validate Prisma client
        run: pnpm db:generate && pnpm db:validate
      - name: Apply database migrations and run database tests
        run: pnpm test:database
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: API integration tests
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
      - name: Formatting
        run: pnpm format:check
